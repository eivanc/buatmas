<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Maaf ya mas sayang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Caveat:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#f6e2e6;
    --rose:#c2185b;
    --rose-dark:#7d1136;
    --paper:#fff8f2;
    --ink:#4a1c2e;
    --muted:#8a5568;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    background:
      radial-gradient(circle at 20% 15%, #fceef1 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #f3d9de 0%, transparent 50%),
      var(--blush);
    font-family:'Poppins', sans-serif;
    color:var(--ink);
  }
  .stage{
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;
    padding:48px 20px 70px;
  }
  .eyebrow{
    letter-spacing:.28em; text-transform:uppercase; font-size:11px;
    color:var(--rose); font-weight:600; margin-bottom:6px; opacity:.85;
  }
  h1{
    font-family:'Playfair Display', serif; font-style:italic; font-weight:700;
    font-size:clamp(26px,6vw,38px); color:var(--rose-dark);
    margin:0 0 6px; text-align:center;
  }
  .sub{
    font-size:13px; color:var(--muted); text-align:center;
    margin:0 0 40px; max-width:320px;
  }

  /* ---------- Hearts ---------- */
  .hearts-row{
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:16px; max-width:420px; margin-bottom:38px;
  }
  .heart-btn{
    width:58px; height:58px;
    border-radius:50%;
    border:none;
    background:#fff;
    box-shadow:0 8px 18px -6px rgba(125,17,54,.25);
    font-size:26px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, background .3s ease;
    position:relative;
  }
  .heart-btn:hover{ transform:translateY(-3px); }
  .heart-btn.used{
    background:linear-gradient(160deg, #f57a95, var(--rose));
    box-shadow:0 10px 22px -6px rgba(194,24,91,.5);
    cursor:default;
  }
  .heart-btn.pop{ animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.35); }
    100%{ transform:scale(1); }
  }
  .heart-btn .num{
    position:absolute; bottom:-18px; left:50%; transform:translateX(-50%);
    font-size:10px; color:var(--muted); font-weight:600;
  }

  /* ---------- Letter area ---------- */
  .letter{
    width:100%; max-width:420px;
    background:var(--paper);
    border-radius:14px;
    box-shadow:0 14px 30px -10px rgba(74,28,46,.25);
    padding:26px 24px 22px;
    min-height:160px;
  }
  .letter-heading{
    font-family:'Playfair Display', serif; font-weight:600; font-size:13px;
    color:var(--rose); letter-spacing:.04em; margin-bottom:10px;
  }
  .line{
    font-family:'Caveat', cursive;
    font-size:22px; line-height:1.4; color:var(--ink);
    opacity:0; max-height:0; overflow:hidden;
    transition:opacity .5s ease, max-height .5s ease, margin .5s ease;
  }
  .line.show{
    opacity:1; max-height:80px; margin-bottom:10px;
  }
  .line b{ color:var(--rose-dark); }
  .placeholder{
    font-size:13px; color:var(--muted); font-style:italic;
  }
  .placeholder.hide{ display:none; }

  .finale{
    margin-top:16px; text-align:center;
    opacity:0; max-height:0; overflow:hidden;
    transition:opacity .6s ease, max-height .6s ease, margin .6s ease;
  }
  .finale.show{ opacity:1; max-height:160px; margin-top:20px; }
  .finale .big{ font-size:34px; margin-bottom:6px; }
  .finale p{
    font-family:'Caveat', cursive; font-size:24px; color:var(--rose-dark); margin:0;
  }

  /* floating hearts burst */
  .burst{ position:relative; width:1px; height:1px; }
  .bf{
    position:absolute; bottom:0; left:0; font-size:16px; color:var(--rose);
    animation:floatUp 2.4s ease-in forwards; pointer-events:none;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) scale(.6); opacity:0; }
    15%{ opacity:1; }
    100%{ transform:translateY(-90px) translateX(var(--dx,0px)) scale(1.05); opacity:0; }
  }

  .hint{ margin-top:22px; font-size:12px; color:var(--muted); opacity:.85; text-align:center; max-width:300px; }
</style>
</head>
<body>

<div class="stage">
  <div class="eyebrow">untuk mas</div>
  <h1>Mas masss susah tau eiva bikin ini</h1>
  <p class="sub">Tapi eiva bisa, emang eiva jago bingbing😔 klik satu-satu lovenya mass heheh</p>

  <div class="hearts-row" id="heartsRow"></div>

  <div class="letter">
    <div class="letter-heading">Untuk: Mas♡</div>
    <p class="placeholder" id="placeholder">Belum ada yang dibuka ituw😔</p>
    <div id="lines"></div>
    <div class="finale" id="finale">
      <div class="big">🤍💛</div>
      <p>makasih udah baca sampai sini, semoga mas maafin yaaa, sayang mas banyak-banyakkk🫂😘</p>
    </div>
  </div>

  <div class="hint">Dari: Eiva💌</div>
</div>

<script>
  const messages = [
    "Maaf ya mass💛",
    "Eiva gamau jadi singa lagi",
    "Marah-marah sama mas, nuduh-nuduh😔",
    "Gapapa kalau mas marahin eiva",
    "memang pantas aja karena eiva bukan orang baik bikin mas cape aja😔",
    "Eiva udah jadi singa gamau lagi😔 eiva minta maaf ya mas, mas kan baik dan ganteng😔"
  ];

  const heartsRow = document.getElementById('heartsRow');
  const linesWrap = document.getElementById('lines');
  const placeholder = document.getElementById('placeholder');
  const finale = document.getElementById('finale');
  let openedCount = 0;

  messages.forEach((msg, i) => {
    const btn = document.createElement('button');
    btn.className = 'heart-btn';
    btn.innerHTML = '🤍<span class="num">' + (i + 1) + '</span>';
    btn.addEventListener('click', () => revealHeart(btn, i));
    heartsRow.appendChild(btn);

    const line = document.createElement('div');
    line.className = 'line';
    line.id = 'line-' + i;
    line.innerHTML = msg;
    linesWrap.appendChild(line);
  });

  function revealHeart(btn, i){
    if (btn.classList.contains('used')) return;
    btn.classList.add('used', 'pop');
    btn.innerHTML = '❤️<span class="num">' + (i + 1) + '</span>';
    setTimeout(() => btn.classList.remove('pop'), 500);

    placeholder.classList.add('hide');
    document.getElementById('line-' + i).classList.add('show');

    burstHearts(btn);

    openedCount++;
    if (openedCount === messages.length){
      setTimeout(() => finale.classList.add('show'), 400);
    }
  }

  function burstHearts(btn){
    const rect = btn.getBoundingClientRect();
    const wrap = document.createElement('div');
    wrap.style.position = 'fixed';
    wrap.style.left = (rect.left + rect.width/2) + 'px';
    wrap.style.top = (rect.top + rect.height/2) + 'px';
    wrap.style.pointerEvents = 'none';
    wrap.style.zIndex = 50;
    document.body.appendChild(wrap);

    const symbols = ['♥','♡','💛'];
    for (let k = 0; k < 5; k++){
      const s = document.createElement('span');
      s.className = 'bf';
      s.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      s.style.setProperty('--dx', (Math.random()*60 - 30) + 'px');
      s.style.animationDelay = (Math.random()*0.15) + 's';
      wrap.appendChild(s);
    }
    setTimeout(() => wrap.remove(), 2600);
  }
</script>

</body>
</html>
